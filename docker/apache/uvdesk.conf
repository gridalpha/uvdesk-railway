# Rendered by the entrypoint: __PORT__ is replaced with Railway's $PORT.
ServerName uvdesk
ServerTokens Prod
ServerSignature Off

# Railway's edge reaches containers from 100.64.0.0/10 and answers from its own
# public range, so all three have to be trusted for mod_remoteip's right-to-left
# walk to land on the real client rather than a rotating proxy address.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 100.64.0.0/10
RemoteIPTrustedProxy 152.233.0.0/17
RemoteIPTrustedProxy fd00::/8
RemoteIPTrustedProxy 127.0.0.0/8

<VirtualHost *:__PORT__>
    DocumentRoot /var/www/uvdesk/public

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
    LogLevel warn

    # Liveness probe: opens the helpdesk's own configured database connection,
    # so it fails when MySQL is gone rather than merely when Apache is. Kept
    # outside the document root so the front controller never sees it.
    Alias /healthz /var/www/health/healthz.php
    <Directory /var/www/health>
        Require all granted
        AllowOverride None
    </Directory>

    <Directory /var/www/uvdesk/public>
        Require all granted
        AllowOverride None
        Options -Indexes +FollowSymLinks

        # public/.htaccess, inlined so AllowOverride can stay off.
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^(.*)$ ./index.php/$1 [QSA,L]
            RewriteCond %{HTTP:Authorization} ^(.*)
            RewriteRule .* - [e=HTTP_AUTHORIZATION:%1]
        </IfModule>
    </Directory>

    # Attachments and uploads live on the volume behind these symlinks; never
    # let the front controller or the directory index expose the listing.
    <DirectoryMatch "^/var/www/uvdesk/public/(assets|attachments)">
        Options -Indexes +FollowSymLinks
        Require all granted
        php_flag engine off
    </DirectoryMatch>

    # Railway variables reach mod_php only when Apache passes them through.
    PassEnv APP_ENV
    PassEnv APP_DEBUG
    PassEnv APP_SECRET
    PassEnv DATABASE_URL
    PassEnv MAILER_DSN
    PassEnv MAILER_URL
    PassEnv TRUSTED_PROXIES
    PassEnv UVDESK_DB_SERVER_VERSION
    PassEnv UV_SESSION_COOKIE_LIFETIME
    PassEnv RAILWAY_PUBLIC_DOMAIN
</VirtualHost>
