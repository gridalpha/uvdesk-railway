memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 32M
post_max_size = 34M
max_file_uploads = 20
expose_php = Off
date.timezone = UTC

; Symfony reads real environment variables through $_ENV, which PHP only
; populates when E is present in variables_order.
variables_order = "EGPCS"

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
